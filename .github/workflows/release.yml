# The open Bike's image, from this repo's own code: on a release tag (v0.6.0), built, pushed to
# ghcr.io/bikeapp-si/bikeapp as 0.6.0 (the version .env names; no "latest", so nothing updates by surprise), and
# signed with cosign (keyless, by this workflow), so update.sh and `cosign verify` (docs/install.md) prove an image
# came from here.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # cosign's keyless signing

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BIKE_VERSION=${{ steps.version.outputs.v }}
          tags: ghcr.io/bikeapp-si/bikeapp:${{ steps.version.outputs.v }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes ghcr.io/bikeapp-si/bikeapp@${{ steps.build.outputs.digest }}
