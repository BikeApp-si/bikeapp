# The open Bike's image, from this repo's own code: on a release tag (v0.6.1), built for x86-64 and ARM on GitHub's
# own machines of each kind, pushed to ghcr.io/bikeapp-si/bikeapp as 0.6.1 (one tag for both; the version .env
# names; no "latest", so nothing updates by surprise), and signed with cosign (keyless, by this workflow), so
# update.sh and `cosign verify` (docs/install.md) prove an image came from here.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # cosign's keyless signing

env:
  IMAGE: ghcr.io/bikeapp-si/bikeapp

jobs:
  # Each platform on its own machine (no emulation), pushed by its digest alone: the tag comes once both are there.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: BIKE_VERSION=${{ steps.version.outputs.v }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Hand on the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One tag over both platforms' images, then the signature: the index and each image in it.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        name: Tag both platforms as the version
        working-directory: ${{ runner.temp }}/digests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # shellcheck disable=SC2046 # one word per digest
          docker buildx imagetools create -t "$IMAGE:$VERSION" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes --recursive "$IMAGE@${{ steps.tag.outputs.digest }}"
